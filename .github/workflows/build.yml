name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: cd dist && zip -r ../explain-this-v${{ steps.version.outputs.version }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: explain-this-v${{ steps.version.outputs.version }}
          path: explain-this-v${{ steps.version.outputs.version }}.zip
